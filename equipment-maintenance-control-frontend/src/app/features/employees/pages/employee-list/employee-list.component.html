<div class="app-page">
  <div class="page__head">
    <button type="button" pButton [text]="true" class="page__back" (click)="goBack()">
      <i class="pi pi-arrow-left"></i>
      Voltar
    </button>
    <div class="page__head-row">
      <div>
        <h2 class="page__title">Funcionários</h2>
      </div>
      <a pButton routerLink="/employees/new">
        <i class="pi pi-plus"></i>
        Novo funcionário
      </a>
    </div>
  </div>

  <p-card>
    <p-table
      [value]="isLoading() ? skeletonRows : employees"
      size="large"
      [paginator]="true"
      [rows]="20"
      [rowsPerPageOptions]="[5, 10, 20]"
    >
      <ng-template #header>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Data de Nascimento</th>
          <th class="text-end" style="width: 110px">Ações</th>
        </tr>
      </ng-template>
      <ng-template #body let-employee>
        <tr>
          @if (isLoading()) {
            <td>
              <p-skeleton width="100%" height="2rem" styleClass="mb-2"></p-skeleton>
            </td>
            <td>
              <p-skeleton width="100%" height="2rem" styleClass="mb-2"></p-skeleton>
            </td>
            <td>
              <p-skeleton width="100%" height="2rem" styleClass="mb-2"></p-skeleton>
            </td>
            <td>
              <p-skeleton width="100%" height="2rem" styleClass="mb-2"></p-skeleton>
            </td>
          } @else {
            <td>{{ employee.name }}</td>
            <td>{{ employee.email }}</td>
            <td>{{ employee.birthDate | date: 'dd/MM/yyyy' : 'UTC' }}</td>
            <td class="text-end">
              <a
                pButton
                [rounded]="true"
                [text]="true"
                severity="secondary"
                [routerLink]="['/employees', employee.id, 'edit']"
                title="Editar"
                aria-label="Editar funcionário"
              >
                <i class="pi pi-pencil"></i>
              </a>
              <button
                pButton
                [rounded]="true"
                [text]="true"
                severity="danger"
                (click)="remove(employee)"
                title="Remover"
                aria-label="Remover funcionário"
              >
                <i class="pi pi-trash"></i>
              </button>
            </td>
          }
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="page__empty">Nenhum funcionário cadastrado.</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
