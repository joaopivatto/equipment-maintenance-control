<div class="page__head-row mb-4">
  <h2 class="page__title">Solicitações de Manutenção Abertas (RF011)</h2>
</div>

<p-table
  [value]="solicitacoes"
  [loading]="loading"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
>
  <ng-template #header>
    <tr>
      <th>Data/Hora</th>
      <th>Cliente</th>
      <th>Equipamento</th>
      <th>Estado</th>
      <th>Ações</th>
    </tr>
  </ng-template>

  <ng-template #body let-soli>
    <tr>
      <td>
        {{ soli.createdAt | date: 'dd/MM/yyyy HH:mm' }}
      </td>
      <td>
        {{ soli.customerName || '-' }}
      </td>
      <td [title]="soli.equipmentDescription">
        {{ (soli.equipmentDescription || '') | slice:0:30 }}
        <span *ngIf="(soli.equipmentDescription || '').length > 30">...</span>
      </td>
      <td>
        <p-tag
          value="ABERTA"
          severity="warn"
        />
      </td>
      <td>
        <div class="actions">
          <button
            type="button"
            pButton
            [text]="true"
            (click)="efetuarOrcamento(soli.id)"
          >
            <i class="pi pi-dollar"></i>
            Orçar
          </button>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="text-center p-4">
        Nenhuma solicitação aberta encontrada.
      </td>
    </tr>
  </ng-template>
</p-table>
