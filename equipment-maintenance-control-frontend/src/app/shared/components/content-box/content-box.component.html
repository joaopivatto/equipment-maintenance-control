<section class="content-box">
  @if (title) {
    <header class="content-box__header">
      <h3 class="content-box__title">{{ title }}</h3>
      @if (subtitle) {
        <p class="content-box__subtitle">{{ subtitle }}</p>
      }
    </header>
  }

  <div class="content-box__body">
    <ng-content></ng-content>
  </div>
</section>
