name: Reset Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite RESETAR para confirmar: isso APAGA o banco atual na VPS (schema.sql + seed.sql)'
        required: true

jobs:
  reset-db:
    name: Resetar banco na VPS
    runs-on: ubuntu-latest

    steps:
      - name: Validar confirmação
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RESETAR" ]; then
            echo "Confirmação inválida. Digite exatamente RESETAR para prosseguir."
            exit 1
          fi

      - name: Configurar chave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rodar schema.sql + seed.sql na VPS
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -euo pipefail
            cd ~/equipment-maintenance-control/equipment-maintenance-control-backend

            # Le as credenciais do container ja em execucao (o Compose ja resolveu o .env
            # com suas proprias regras; dar "source" no .env como shell script quebra se
            # algum valor tiver "!", aspas, "$" etc.)
            DB_USER=$(docker compose exec -T backend printenv SPRING_DATASOURCE_USERNAME)
            DB_PASSWORD=$(docker compose exec -T backend printenv SPRING_DATASOURCE_PASSWORD)

            mysql -u "$DB_USER" -p"$DB_PASSWORD" < src/main/resources/db/schema.sql
            mysql -u "$DB_USER" -p"$DB_PASSWORD" < src/main/resources/db/seed.sql
            docker compose restart backend
          '
