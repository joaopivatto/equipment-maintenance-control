name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test and Format
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: equipment-maintenance-control-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: equipment-maintenance-control-backend/pom.xml

      - name: Check formatting
        run: ./mvnw spotless:check

      - name: Build and test
        run: ./mvnw clean verify