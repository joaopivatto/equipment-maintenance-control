name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # permite rodar manualmente pela aba Actions

# Um deploy por vez; se chegar outro push, espera o atual terminar
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest

    steps:
      - name: Configurar chave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rodar deploy.sh na VPS
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash ~/equipment-maintenance-control/deploy.sh"